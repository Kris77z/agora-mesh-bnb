        <button data-lang="en">EN</button>

  <section id="hero-layer" class="hero-layer">
    <div class="hero">
      <span class="sys-tag" data-i18n="hero.tag"></span>
      <h1 class="hero-title"><span data-i18n="hero.title.a"></span><em data-i18n="hero.title.em"></em><span data-i18n="hero.title.b"></span></h1>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <div class="hero-actions">
        <a class="btn-terminal" href="/marketplace" data-i18n="hero.cta"></a>
      </div>
    </div>
    <div class="floating-stats">
      <div class="f-stat"><span class="val" data-i18n="hero.p1.k"></span><span class="lbl" data-i18n="hero.p1.v"></span></div>

    </div>

    <div id="zoom-stage" class="zoom-stage">

      <div class="how-step"><span class="how-n" data-i18n="how.s1.n"></span><h3 data-i18n="how.s1.t"></h3><p data-i18n="how.s1.d"></p></div>

    <div class="why-grid">
      <div class="why-item"><h4 data-i18n="why.i1.t"></h4><p data-i18n="why.i1.d"></p></div>

      <div class="why-item"><h4 data-i18n="why.i6.t"></h4><p data-i18n="why.i6.d"></p></div>

    <div class="show-text">
