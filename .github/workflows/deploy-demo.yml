name: Deploy backend host

# Vercel deploys the frontend independently from main. This workflow deploys only backend services.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to deploy (defaults to the ref being run)
        required: false
  # push:
  #   branches: [feat/bnb-agora-mesh]

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.revision || github.sha }}

      - name: Open SSH to the demo host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -T 20 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ship and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REVISION: ${{ github.event.inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          scp -o BatchMode=yes -i ~/.ssh/deploy deploy/update-dedicated-demo.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/agora-backend-update.sh"
          ssh -o BatchMode=yes -i ~/.ssh/deploy "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash /tmp/agora-backend-update.sh $REVISION"

      - name: Verify the public origin
        run: |
          for path in /api/hunter/health /api/registry/services /api/hunter/browser-authority/config; do
            curl --retry 12 --retry-delay 5 --retry-all-errors --fail -sS -o /dev/null --max-time 30 "https://43-165-167-118.sslip.io$path"
            echo "$path -> OK"
          done
          for path in / /dashboard /marketplace; do
            location=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 30 "https://43-165-167-118.sslip.io$path")
            [ "$location" = "https://agora-mesh-bnb.vercel.app$path" ]
            echo "$path -> Vercel"
          done
          curl --fail -sS --max-time 30 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' https://agora-mesh-bnb.vercel.app/api/altana/rpc | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"] == "0x61"'
